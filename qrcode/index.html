<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二维码生成器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Cpath d='M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h2v2H9zM12 9h2v2h-2zM9 12h2v2H9zM12 12h2v2h-2z' fill='%23000'/%3E%3Cpath d='M3.5 3.5h2v2h-2zM10.5 3.5h2v2h-2zM3.5 10.5h2v2h-2z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #6b7280;
    --line: #e4e7eb;
    --accent: #2f6fed;
    --accent-soft: #eaf1fe;
    --warn-bg: #fff7e6;
    --warn-line: #f0d9a8;
    --warn-text: #8a5a00;
    --err-bg: #fdecec;
    --err-line: #f3c2c2;
    --err-text: #a52222;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --card: #1e2126;
      --text: #e8eaed;
      --muted: #9aa2ad;
      --line: #313640;
      --accent: #6d9bff;
      --accent-soft: #232c3d;
      --warn-bg: #33290f;
      --warn-line: #574517;
      --warn-text: #e5c37a;
      --err-bg: #3a1f1f;
      --err-line: #5c2f2f;
      --err-text: #f0a3a3;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 20px 64px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 980px; margin: 0 auto; }

  header { margin-bottom: 24px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .preview-card { order: -1; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
  }

  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .hint { font-weight: 400; color: var(--muted); }

  textarea, input[type=text], select {
    width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  textarea { resize: vertical; min-height: 88px; line-height: 1.5; word-break: break-all; }
  textarea:focus, input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }

  .range-row { display: flex; align-items: center; gap: 12px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .range-val {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--muted);
    min-width: 62px;
    text-align: right;
  }

  .swatch { display: flex; align-items: center; gap: 8px; }
  input[type=color] {
    width: 40px; height: 34px; padding: 0;
    border: 1px solid var(--line); border-radius: 8px;
    background: none; cursor: pointer;
  }
  .swatch input[type=text] { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px; }

  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 10px; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; }
  .check label { margin: 0; font-weight: 400; color: inherit; }

  /* 预览 */
  .preview-card { text-align: center; position: sticky; top: 24px; }
  .qr-box {
    display: flex; align-items: center; justify-content: center;
    min-height: 260px;
    border-radius: 10px;
    padding: 8px;
    background: var(--bg);
  }
  /* 仅在透明背景模式下显示棋盘格 */
  .qr-box.alpha {
    background-image:
      linear-gradient(45deg, rgba(128,128,128,.16) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.16) 75%),
      linear-gradient(45deg, rgba(128,128,128,.16) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.16) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  #canvas { max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 4px; display: none; }
  .placeholder { color: var(--muted); font-size: 14px; }

  .meta {
    margin-top: 14px; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; min-height: 20px;
  }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  button {
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    transition: background .12s, border-color .12s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.wide { grid-column: 1 / -1; }

  .notice {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    font-size: 13px; text-align: left; display: none;
  }
  .notice.show { display: block; }
  .notice.warn { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-text); }
  .notice.err  { background: var(--err-bg);  border: 1px solid var(--err-line);  color: var(--err-text); }
  .notice button {
    margin-top: 8px; padding: 4px 10px; font-size: 12px;
    background: transparent; border-color: currentColor; color: inherit;
  }
  .notice button:hover { color: inherit; filter: brightness(1.15); }

  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .presets button { padding: 4px 10px; font-size: 12px; font-weight: 500; border-radius: 999px; }

  footer { margin-top: 28px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>二维码生成器</h1>
    <p class="sub">输入链接或任意文字，实时生成二维码，可下载 PNG / SVG。纯本地运行，内容不上传。</p>
  </header>

  <div class="layout">
    <!-- 左：设置 -->
    <section class="card">
      <div class="field">
        <label for="text">内容 <span class="hint">— 链接、文字、WiFi 配置都可以</span></label>
        <textarea id="text" placeholder="https://example.com" spellcheck="false" autocomplete="off">https://example.com</textarea>
        <div class="presets">
          <button type="button" data-fill="https://www.example.com/">示例链接</button>
          <button type="button" data-fill="WIFI:T:WPA;S:网络名称;P:密码;;">WiFi 连接</button>
          <button type="button" data-fill="mailto:someone@example.com">邮件地址</button>
          <button type="button" data-fill="tel:+8613800138000">电话号码</button>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="ecl">纠错等级</label>
          <select id="ecl">
            <option value="L">L — 约 7%（图最小）</option>
            <option value="M" selected>M — 约 15%（推荐）</option>
            <option value="Q">Q — 约 25%</option>
            <option value="H">H — 约 30%（最耐污损）</option>
          </select>
        </div>
        <div class="field">
          <label for="margin">白边 <span class="hint">（模块数）</span></label>
          <div class="range-row">
            <input type="range" id="margin" min="0" max="8" step="1" value="4">
            <span class="range-val" id="marginVal">4</span>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="size">导出尺寸</label>
        <div class="range-row">
          <input type="range" id="size" min="128" max="2048" step="32" value="512">
          <span class="range-val" id="sizeVal">512 px</span>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="dark">前景色</label>
          <div class="swatch">
            <input type="color" id="dark" value="#000000">
            <input type="text" id="darkHex" value="#000000" spellcheck="false">
          </div>
        </div>
        <div class="field">
          <label for="light">背景色</label>
          <div class="swatch">
            <input type="color" id="light" value="#ffffff">
            <input type="text" id="lightHex" value="#ffffff" spellcheck="false">
          </div>
          <div class="check">
            <input type="checkbox" id="transparent">
            <label for="transparent">透明背景（仅 PNG / SVG）</label>
          </div>
        </div>
      </div>
    </section>

    <!-- 右：预览 -->
    <section class="card preview-card">
      <div class="qr-box" id="qrBox">
        <canvas id="canvas"></canvas>
        <div class="placeholder" id="placeholder">请输入内容</div>
      </div>
      <div class="meta" id="meta"></div>

      <div class="actions">
        <button class="primary" id="dlPng" disabled>下载 PNG</button>
        <button id="dlSvg" disabled>下载 SVG</button>
        <button class="wide" id="copyBtn" disabled>复制图片到剪贴板</button>
      </div>

      <div class="notice warn" id="warn"></div>
      <div class="notice err" id="err"></div>
    </section>
  </div>

  <footer>离线可用 · 支持中文与 Emoji · 最长约 2953 字节（纠错等级 L）</footer>
</div>

<script src="qrcode.js"></script>
<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const els = {
    text: $('text'), ecl: $('ecl'), margin: $('margin'), marginVal: $('marginVal'),
    size: $('size'), sizeVal: $('sizeVal'),
    dark: $('dark'), darkHex: $('darkHex'), light: $('light'), lightHex: $('lightHex'),
    transparent: $('transparent'),
    canvas: $('canvas'), qrBox: $('qrBox'), placeholder: $('placeholder'), meta: $('meta'),
    dlPng: $('dlPng'), dlSvg: $('dlSvg'), copyBtn: $('copyBtn'),
    warn: $('warn'), err: $('err'),
  };

  let current = null; // 最近一次成功生成的结果

  // ---------- 工具 ----------

  const HEX_RE = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;

  function relLuminance(hex) {
    let h = hex.slice(1);
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const ch = [0, 2, 4].map((i) => {
      const v = parseInt(h.substr(i, 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  }

  function contrastRatio(a, b) {
    const la = relLuminance(a), lb = relLuminance(b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  }

  function fileBase(text) {
    let name = 'qrcode';
    try {
      const u = new URL(text);
      if (u.hostname) name = 'qrcode-' + u.hostname.replace(/^www\./, '');
    } catch (e) {
      const s = text.trim().slice(0, 20).replace(/[\\/:*?"<>|\s]+/g, '-').replace(/^-+|-+$/g, '');
      if (s) name = 'qrcode-' + s;
    }
    return name;
  }

  function download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function showNotice(el, html) {
    el.innerHTML = html;
    el.classList.add('show');
  }
  function hideNotice(el) {
    el.classList.remove('show');
    el.innerHTML = '';
  }

  // 看起来像光秃秃的域名（没写 http/https 等协议）
  function looksLikeBareDomain(t) {
    return /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(t) && !/^[a-zA-Z][\w+.-]*:/.test(t);
  }

  // ---------- 核心：渲染 ----------

  function render() {
    const text = els.text.value;
    hideNotice(els.err);
    hideNotice(els.warn);

    if (!text) {
      current = null;
      els.canvas.style.display = 'none';
      els.placeholder.style.display = 'block';
      els.placeholder.textContent = '请输入内容';
      els.meta.textContent = '';
      [els.dlPng, els.dlSvg, els.copyBtn].forEach((b) => (b.disabled = true));
      return;
    }

    const darkColor = HEX_RE.test(els.darkHex.value) ? els.darkHex.value : els.dark.value;
    const lightColor = els.transparent.checked
      ? 'transparent'
      : (HEX_RE.test(els.lightHex.value) ? els.lightHex.value : els.light.value);
    const margin = +els.margin.value;
    const opts = { margin, dark: darkColor, light: lightColor, size: +els.size.value };
    els.qrBox.classList.toggle('alpha', els.transparent.checked);

    let qr;
    try {
      qr = QRCode.generate(text, els.ecl.value);
    } catch (e) {
      current = null;
      els.canvas.style.display = 'none';
      els.placeholder.style.display = 'block';
      els.placeholder.textContent = '无法生成';
      els.meta.textContent = '';
      [els.dlPng, els.dlSvg, els.copyBtn].forEach((b) => (b.disabled = true));
      showNotice(els.err, e.message);
      return;
    }

    QRCode.toCanvas(qr, els.canvas, opts);
    current = { qr, opts, text };

    els.canvas.style.display = 'block';
    els.placeholder.style.display = 'none';
    [els.dlPng, els.dlSvg, els.copyBtn].forEach((b) => (b.disabled = false));

    const bytes = new TextEncoder().encode(text).length;
    const eclNote = qr.ecl !== els.ecl.value ? `${els.ecl.value} → ${qr.ecl}（自动提升）` : qr.ecl;
    els.meta.textContent =
      `版本 ${qr.version} · ${qr.size}×${qr.size} 模块 · 纠错 ${eclNote} · ` +
      `${bytes} 字节 · 输出 ${els.canvas.width}px`;

    // 提示：像域名但没写协议
    if (looksLikeBareDomain(text.trim())) {
      showNotice(
        els.warn,
        '这看起来是个网址，但没有 <code>https://</code> 前缀。部分扫码 App 会当成纯文字而不是链接。' +
          '<br><button type="button" id="fixProto">补上 https://</button>'
      );
      const btn = $('fixProto');
      if (btn) btn.addEventListener('click', () => {
        els.text.value = 'https://' + els.text.value.trim();
        render();
      });
    } else if (lightColor !== 'transparent' && contrastRatio(darkColor, lightColor) < 3) {
      // 提示：对比度过低
      showNotice(els.warn, '前景色与背景色对比度过低，很可能扫不出来，建议加大反差。');
    } else if (relLuminance(darkColor) > 0.5 && lightColor !== 'transparent' &&
               relLuminance(darkColor) > relLuminance(lightColor)) {
      showNotice(els.warn, '前景色比背景色更亮（反色二维码），部分扫码 App 不支持，建议前景用深色。');
    } else if (margin < 2) {
      showNotice(els.warn, '白边太窄可能影响识别，标准建议保留 4 个模块的静区。');
    }
  }

  // 防抖，避免长文本每敲一个字都重算
  let timer = null;
  function scheduleRender() {
    clearTimeout(timer);
    timer = setTimeout(render, 120);
  }

  // ---------- 事件绑定 ----------

  els.text.addEventListener('input', scheduleRender);
  els.ecl.addEventListener('change', render);

  els.margin.addEventListener('input', () => {
    els.marginVal.textContent = els.margin.value;
    scheduleRender();
  });
  els.size.addEventListener('input', () => {
    els.sizeVal.textContent = els.size.value + ' px';
    scheduleRender();
  });

  // 颜色选择器与十六进制输入框双向同步
  function linkColor(picker, hexInput) {
    picker.addEventListener('input', () => {
      hexInput.value = picker.value;
      scheduleRender();
    });
    hexInput.addEventListener('input', () => {
      if (HEX_RE.test(hexInput.value)) {
        picker.value = hexInput.value.length === 4
          ? '#' + hexInput.value.slice(1).split('').map((c) => c + c).join('')
          : hexInput.value;
        scheduleRender();
      }
    });
  }
  linkColor(els.dark, els.darkHex);
  linkColor(els.light, els.lightHex);

  els.transparent.addEventListener('change', () => {
    els.light.disabled = els.transparent.checked;
    els.lightHex.disabled = els.transparent.checked;
    render();
  });

  document.querySelectorAll('[data-fill]').forEach((btn) => {
    btn.addEventListener('click', () => {
      els.text.value = btn.dataset.fill;
      els.text.focus();
      render();
    });
  });

  // ---------- 导出 ----------

  els.dlPng.addEventListener('click', () => {
    if (!current) return;
    els.canvas.toBlob((blob) => download(blob, fileBase(current.text) + '.png'), 'image/png');
  });

  els.dlSvg.addEventListener('click', () => {
    if (!current) return;
    const svg = QRCode.toSvg(current.qr, current.opts);
    download(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }), fileBase(current.text) + '.svg');
  });

  els.copyBtn.addEventListener('click', () => {
    if (!current) return;
    const original = els.copyBtn.textContent;
    const done = (msg) => {
      els.copyBtn.textContent = msg;
      setTimeout(() => (els.copyBtn.textContent = original), 1600);
    };
    if (!navigator.clipboard || !window.ClipboardItem) {
      done('浏览器不支持复制');
      return;
    }
    els.canvas.toBlob((blob) => {
      navigator.clipboard
        .write([new ClipboardItem({ 'image/png': blob })])
        .then(() => done('已复制 ✓'))
        .catch(() => done('复制失败'));
    }, 'image/png');
  });

  render();
})();
</script>
</body>
</html>
